<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sync Customer ke Redis</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 16px;
            padding: 30px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        h1 {
            color: #FF9800;
            font-size: 1.5rem;
            margin-bottom: 6px;
        }
        .subtitle {
            color: #888;
            font-size: 0.85rem;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 14px;
        }
        .form-group label {
            display: block;
            font-weight: 600;
            font-size: 0.85rem;
            margin-bottom: 4px;
            color: #333;
        }
        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 0.95rem;
            font-family: inherit;
        }
        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: #FF9800;
            box-shadow: 0 0 0 3px rgba(255,152,0,0.1);
        }
        .form-group textarea {
            resize: vertical;
            min-height: 60px;
        }
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            width: 100%;
        }
        .btn-primary {
            background: linear-gradient(135deg, #FF9800, #FF5722);
            color: white;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(255,152,0,0.3);
        }
        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .btn-secondary {
            background: #e9ecef;
            color: #333;
            margin-top: 10px;
        }
        .btn-secondary:hover {
            background: #dee2e6;
        }
        .status-box {
            padding: 12px 16px;
            border-radius: 8px;
            margin-top: 16px;
            display: none;
            font-weight: 500;
        }
        .status-box.success {
            display: block;
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .status-box.error {
            display: block;
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .status-box.info {
            display: block;
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
        .status-box.warning {
            display: block;
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffc107;
        }
        .result-box {
            margin-top: 16px;
            padding: 12px;
            background: #f8f9fa;
            border-radius: 8px;
            font-family: monospace;
            font-size: 0.8rem;
            white-space: pre-wrap;
            word-break: break-all;
            max-height: 200px;
            overflow-y: auto;
            display: none;
            border: 1px solid #e9ecef;
        }
        .result-box.show {
            display: block;
        }
        .row {
            display: flex;
            gap: 12px;
        }
        .row .form-group {
            flex: 1;
        }
        .loading-spinner {
            display: none;
            text-align: center;
            padding: 20px 0;
        }
        .loading-spinner .spinner {
            width: 30px;
            height: 30px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #FF9800;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .inline-flex {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .inline-flex .btn {
            width: auto;
            padding: 8px 16px;
        }
        .mt-2 { margin-top: 12px; }
        .mb-2 { margin-bottom: 12px; }
        .text-muted { color: #888; font-size: 0.8rem; }
        hr { border: none; border-top: 1px solid #eee; margin: 16px 0; }
    </style>
</head>
<body>

    <div class="container">
        <h1>📥 Sync Customer ke Redis</h1>
        <div class="subtitle">Simpan data customer dari Firebase ke Redis</div>

        <!-- Status Message -->
        <div class="status-box" id="statusBox"></div>

        <!-- Loading Spinner -->
        <div class="loading-spinner" id="loadingSpinner">
            <div class="spinner"></div>
            <p style="margin-top: 8px; color: #888;">Memproses...</p>
        </div>

        <!-- Form -->
        <form id="syncForm">
            <div class="form-group">
                <label for="uidInput">User ID (UID) *</label>
                <input type="text" id="uidInput" placeholder="Masukkan UID customer dari Firebase" required />
            </div>

            <div class="form-group">
                <label for="nameInput">Nama Lengkap *</label>
                <input type="text" id="nameInput" placeholder="Nama customer" required />
            </div>

            <div class="row">
                <div class="form-group">
                    <label for="emailInput">Email *</label>
                    <input type="email" id="emailInput" placeholder="email@example.com" required />
                </div>
                <div class="form-group">
                    <label for="phoneInput">Telepon *</label>
                    <input type="tel" id="phoneInput" placeholder="08123456789" required />
                </div>
            </div>

            <div class="form-group">
                <label for="addressInput">Alamat</label>
                <textarea id="addressInput" placeholder="Alamat lengkap customer"></textarea>
            </div>

            <div class="row">
                <div class="form-group">
                    <label for="genderSelect">Jenis Kelamin</label>
                    <select id="genderSelect">
                        <option value="">-- Pilih --</option>
                        <option value="Laki-laki">Laki-laki</option>
                        <option value="Perempuan">Perempuan</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="statusSelect">Status</label>
                    <select id="statusSelect">
                        <option value="active">Active</option>
                        <option value="inactive">Inactive</option>
                        <option value="pending">Pending</option>
                    </select>
                </div>
            </div>

            <div class="row">
                <div class="form-group">
                    <label>Rating</label>
                    <input type="number" id="ratingInput" value="5" min="1" max="5" step="0.1" />
                </div>
                <div class="form-group">
                    <label>Perjalanan</label>
                    <input type="number" id="tripsInput" value="0" min="0" />
                </div>
            </div>

            <button type="submit" class="btn btn-primary" id="submitBtn">
                <i class="fas fa-save"></i> Simpan ke Redis
            </button>
        </form>

        <hr />

        <!-- Tombol Cek Data -->
        <div class="inline-flex" style="justify-content:space-between; flex-wrap:wrap; gap:8px;">
            <button class="btn btn-secondary" id="checkBtn" style="flex:1;">
                <i class="fas fa-search"></i> Cek Data di Redis
            </button>
        </div>

        <!-- Result Box -->
        <div class="result-box" id="resultBox"></div>
    </div>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <script>
        // ==================== KONFIGURASI ====================
        const API_BASE = '/api';

        // ==================== DOM REFS ====================
        const form = document.getElementById('syncForm');
        const uidInput = document.getElementById('uidInput');
        const nameInput = document.getElementById('nameInput');
        const emailInput = document.getElementById('emailInput');
        const phoneInput = document.getElementById('phoneInput');
        const addressInput = document.getElementById('addressInput');
        const genderSelect = document.getElementById('genderSelect');
        const statusSelect = document.getElementById('statusSelect');
        const ratingInput = document.getElementById('ratingInput');
        const tripsInput = document.getElementById('tripsInput');
        const submitBtn = document.getElementById('submitBtn');
        const statusBox = document.getElementById('statusBox');
        const resultBox = document.getElementById('resultBox');
        const loadingSpinner = document.getElementById('loadingSpinner');
        const checkBtn = document.getElementById('checkBtn');

        // ==================== UTILITY ====================
        function showStatus(message, type = 'info') {
            statusBox.className = 'status-box ' + type;
            statusBox.textContent = message;
            statusBox.style.display = 'block';
        }

        function hideStatus() {
            statusBox.style.display = 'none';
        }

        function showLoading(show) {
            loadingSpinner.style.display = show ? 'block' : 'none';
            submitBtn.disabled = show;
        }

        function showResult(data) {
            resultBox.textContent = JSON.stringify(data, null, 2);
            resultBox.classList.add('show');
        }

        function hideResult() {
            resultBox.classList.remove('show');
        }

        function formatPhone(phone) {
            let cleaned = phone.replace(/\D/g, '');
            if (cleaned.startsWith('0')) cleaned = '+62' + cleaned.substring(1);
            else if (cleaned.startsWith('62')) cleaned = '+' + cleaned;
            else if (!cleaned.startsWith('+')) cleaned = '+62' + cleaned;
            return cleaned;
        }

        // ==================== SIMPAN KE REDIS ====================
        async function saveCustomerToRedis(userData) {
            try {
                const response = await fetch(`${API_BASE}/customer`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(userData)
                });
                
                // Cek response status
                if (!response.ok) {
                    // Baca response sebagai text
                    const text = await response.text();
                    console.error('Response error:', response.status, text);
                    
                    // Coba parse sebagai JSON jika mungkin
                    try {
                        const json = JSON.parse(text);
                        return { success: false, message: json.message || text };
                    } catch (e) {
                        return { success: false, message: text || `HTTP ${response.status}` };
                    }
                }
                
                const result = await response.json();
                return result;
            } catch (err) {
                console.error('Network error:', err);
                return { success: false, message: err.message || 'Network error' };
            }
        }

        // ==================== CEK DATA DI REDIS ====================
        async function checkCustomerInRedis(uid) {
            try {
                const response = await fetch(`${API_BASE}/customer/${uid}`);
                if (response.status === 404) {
                    return { success: false, message: 'Customer not found', notFound: true };
                }
                if (!response.ok) {
                    const text = await response.text();
                    return { success: false, message: text || `HTTP ${response.status}` };
                }
                const result = await response.json();
                return result;
            } catch (err) {
                return { success: false, message: err.message };
            }
        }

        // ==================== HANDLE FORM SUBMIT ====================
        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            hideStatus();
            hideResult();
            showLoading(true);

            try {
                const uid = uidInput.value.trim();
                const name = nameInput.value.trim();
                const email = emailInput.value.trim();
                const phoneRaw = phoneInput.value.trim();
                const address = addressInput.value.trim();
                const gender = genderSelect.value;
                const status = statusSelect.value;
                const rating = parseFloat(ratingInput.value) || 5;
                const perjalanan = parseInt(tripsInput.value) || 0;

                // Validasi
                if (!uid) { showStatus('UID harus diisi!', 'error'); return; }
                if (!name) { showStatus('Nama harus diisi!', 'error'); return; }
                if (!email) { showStatus('Email harus diisi!', 'error'); return; }
                if (!phoneRaw) { showStatus('Telepon harus diisi!', 'error'); return; }

                const phone = formatPhone(phoneRaw);

                const userData = {
                    uid: uid,
                    name: name,
                    email: email,
                    phone: phone,
                    address: address || '',
                    gender: gender || '',
                    status: status,
                    photoURL: '',
                    rating: rating,
                    perjalanan: perjalanan,
                    createdAt: new Date().toISOString()
                };

                const result = await saveCustomerToRedis(userData);
                
                if (result.success) {
                    showStatus('✅ Data customer berhasil disimpan ke Redis!', 'success');
                    showResult(userData);
                } else {
                    showStatus('❌ Gagal simpan ke Redis: ' + (result.message || 'Unknown error'), 'error');
                }
            } catch (err) {
                showStatus('❌ Error: ' + err.message, 'error');
            } finally {
                showLoading(false);
            }
        });

        // ==================== CEK DATA ====================
        checkBtn.addEventListener('click', async function() {
            const uid = uidInput.value.trim();
            if (!uid) {
                showStatus('Masukkan UID terlebih dahulu!', 'warning');
                return;
            }

            hideStatus();
            showLoading(true);
            hideResult();

            try {
                const result = await checkCustomerInRedis(uid);
                if (result.success && result.data) {
                    showStatus('✅ Data ditemukan di Redis!', 'success');
                    showResult(result.data);
                } else if (result.notFound) {
                    showStatus('❌ Data tidak ditemukan di Redis', 'error');
                } else {
                    showStatus('❌ Gagal cek: ' + result.message, 'error');
                }
            } catch (err) {
                showStatus('❌ Error: ' + err.message, 'error');
            } finally {
                showLoading(false);
            }
        });

        // ==================== INIT ====================
        // Jika ada parameter UID di URL, auto-fill
        const urlParams = new URLSearchParams(window.location.search);
        const uidParam = urlParams.get('uid');
        if (uidParam) {
            uidInput.value = uidParam;
            // Auto cek data
            setTimeout(() => checkBtn.click(), 500);
        }

        console.log('📥 Sync Customer Tool loaded');
        console.log('💡 Tips: isi form lalu klik Simpan, atau cek data dengan tombol Cek Data');
    </script>

</body>
</html>
