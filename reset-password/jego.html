<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - MoveGo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.12);
            max-width: 440px;
            width: 100%;
        }
        .logo {
            text-align: center;
            font-size: 48px;
            margin-bottom: 10px;
        }
        .title {
            text-align: center;
            color: #2e7d32;
            font-size: 24px;
            margin-bottom: 8px;
        }
        .subtitle {
            text-align: center;
            color: #888;
            font-size: 14px;
            margin-bottom: 24px;
        }
        .info-box {
            background: #e3f2fd;
            padding: 14px 16px;
            border-radius: 8px;
            border-left: 4px solid #2196F3;
            font-size: 14px;
            color: #0d47a1;
            margin-bottom: 20px;
            word-break: break-all;
        }
        .info-box strong {
            display: block;
            margin-bottom: 4px;
        }
        label {
            font-weight: 600;
            font-size: 14px;
            color: #333;
            display: block;
            margin-top: 16px;
            margin-bottom: 6px;
        }
        input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            transition: 0.2s;
        }
        input:focus {
            border-color: #4CAF50;
            outline: none;
            box-shadow: 0 0 0 3px rgba(76, 175, 80, 0.2);
        }
        .btn {
            width: 100%;
            padding: 14px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
            transition: 0.2s;
        }
        .btn:hover {
            background: #388E3C;
        }
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .message {
            margin-top: 16px;
            padding: 12px 14px;
            border-radius: 8px;
            font-size: 14px;
            display: none;
        }
        .message.error {
            display: block;
            background: #ffebee;
            color: #c62828;
            border-left: 4px solid #f44336;
        }
        .message.success {
            display: block;
            background: #e8f5e9;
            color: #2e7d32;
            border-left: 4px solid #4CAF50;
        }
        .message.loading {
            display: block;
            background: #fff3e0;
            color: #e65100;
            border-left: 4px solid #FF9800;
        }
        .footer {
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
            color: #999;
        }
        .footer a {
            color: #2196F3;
            text-decoration: none;
        }
        .password-rules {
            font-size: 12px;
            color: #888;
            margin-top: 4px;
        }
        .password-rules.valid {
            color: #4CAF50;
        }
        .password-rules.invalid {
            color: #f44336;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="logo">🚗</div>
    <div class="title">Reset Password</div>
    <div class="subtitle">Masukkan password baru Anda</div>

    <div class="info-box" id="emailInfo">
        <strong>📧 Akun:</strong>
        <span id="userEmail">Memuat...</span>
    </div>

    <label for="newPassword">Password Baru</label>
    <input type="password" id="newPassword" placeholder="Minimal 6 karakter" oninput="validatePassword()">
    <div class="password-rules" id="passwordRules">🔒 Minimal 6 karakter</div>

    <label for="confirmPassword">Konfirmasi Password</label>
    <input type="password" id="confirmPassword" placeholder="Ketik ulang password" oninput="validatePassword()">

    <button class="btn" id="resetBtn" onclick="resetPassword()">🔑 Reset Password</button>

    <div class="message" id="message"></div>

    <div class="footer">
        <a href="https://movego.my.id">← Kembali ke Beranda</a>
    </div>
</div>

<script>
    // Ambil parameter dari URL
    const urlParams = new URLSearchParams(window.location.search);
    const mode = urlParams.get('mode');
    const oobCode = urlParams.get('oobCode');
    const apiKey = urlParams.get('apiKey') || 'AIzaSyBp3WfOk5-0ZJIkxHc5bbqB2N4z8pY9lVY';

    // Validasi link
    if (!oobCode || mode !== 'resetPassword') {
        document.getElementById('message').className = 'message error';
        document.getElementById('message').textContent = '❌ Link reset password tidak valid atau sudah kadaluwarsa.';
        document.getElementById('resetBtn').disabled = true;
    }

    // Ambil email user dari Firebase
    async function getUserEmail() {
        try {
            const response = await fetch(
                `https://identitytoolkit.googleapis.com/v1/accounts:lookup?key=${apiKey}`,
                {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ oobCode: oobCode })
                }
            );
            const result = await response.json();
            if (result.users && result.users.length > 0) {
                document.getElementById('userEmail').textContent = result.users[0].email;
            } else {
                document.getElementById('userEmail').textContent = 'Email tidak ditemukan';
            }
        } catch (error) {
            document.getElementById('userEmail').textContent = 'Gagal memuat email';
        }
    }

    if (oobCode) {
        getUserEmail();
    }

    // Validasi password
    function validatePassword() {
        const password = document.getElementById('newPassword').value;
        const confirm = document.getElementById('confirmPassword').value;
        const rules = document.getElementById('passwordRules');

        if (password.length === 0) {
            rules.textContent = '🔒 Minimal 6 karakter';
            rules.className = 'password-rules';
            return;
        }

        if (password.length < 6) {
            rules.textContent = '❌ Password minimal 6 karakter';
            rules.className = 'password-rules invalid';
            return;
        }

        if (confirm.length > 0 && password !== confirm) {
            rules.textContent = '❌ Password tidak cocok';
            rules.className = 'password-rules invalid';
            return;
        }

        if (password.length >= 6 && password === confirm) {
            rules.textContent = '✅ Password valid dan cocok';
            rules.className = 'password-rules valid';
        } else {
            rules.textContent = '✅ Password valid';
            rules.className = 'password-rules valid';
        }
    }

    // Reset password
    async function resetPassword() {
        const password = document.getElementById('newPassword').value;
        const confirm = document.getElementById('confirmPassword').value;
        const messageDiv = document.getElementById('message');
        const resetBtn = document.getElementById('resetBtn');

        // Validasi
        if (password.length < 6) {
            messageDiv.className = 'message error';
            messageDiv.textContent = '❌ Password minimal 6 karakter.';
            return;
        }

        if (password !== confirm) {
            messageDiv.className = 'message error';
            messageDiv.textContent = '❌ Password tidak cocok.';
            return;
        }

        // Loading state
        messageDiv.className = 'message loading';
        messageDiv.textContent = '⏳ Memproses reset password...';
        resetBtn.disabled = true;

        try {
            const response = await fetch(
                `https://identitytoolkit.googleapis.com/v1/accounts:reset?key=${apiKey}`,
                {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        oobCode: oobCode,
                        newPassword: password
                    })
                }
            );

            const result = await response.json();

            if (result.error) {
                messageDiv.className = 'message error';
                messageDiv.textContent = '❌ ' + result.error.message;
                resetBtn.disabled = false;
            } else {
                messageDiv.className = 'message success';
                messageDiv.innerHTML = '✅ Password berhasil direset! <br> Mengalihkan ke halaman login...';
                
                setTimeout(() => {
                    window.location.href = 'https://movego.my.id/login';
                }, 3000);
            }
        } catch (error) {
            messageDiv.className = 'message error';
            messageDiv.textContent = '❌ Terjadi kesalahan: ' + error.message;
            resetBtn.disabled = false;
        }
    }

    // Enter key support
    document.getElementById('confirmPassword').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            resetPassword();
        }
    });
    document.getElementById('newPassword').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            document.getElementById('confirmPassword').focus();
        }
    });
</script>

</body>
</html>
