<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>CS Live Chat - JeGo</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #FF6D00;
            --primary-dark: #E65100;
            --primary-light: #FFB74D;
            --background: #F5F5F5;
            --surface: #FFFFFF;
            --text-primary: #212121;
            --text-secondary: #757575;
            --border: #E0E0E0;
            --bubble-cs: #FFE0B3;
            --bubble-customer: #E0E0E0;
            --online: #4CAF50;
            --offline: #9E9E9E;
        }
        body.dark-mode {
            --background: #121212;
            --surface: #1E1E1E;
            --text-primary: #FFFFFF;
            --text-secondary: #B0B0B0;
            --border: #333333;
            --bubble-cs: #3a2a1a;
            --bubble-customer: #2C2C2C;
            --online: #66BB6A;
            --offline: #757575;
        }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: var(--background);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        /* ===== HEADER ===== */
        .app-bar {
            background: linear-gradient(135deg, var(--primary-dark), var(--primary));
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 16px;
            color: white;
            flex-shrink: 0;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .app-bar .back-btn {
            background: rgba(255,255,255,0.2);
            width: 40px;
            height: 40px;
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 20px;
            text-decoration: none;
            color: white;
            border: none;
        }
        .app-bar h2 { flex: 1; font-size: 1.2rem; }
        .app-bar .badge-cs {
            background: rgba(255,255,255,0.2);
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .dark-toggle {
            background: rgba(255,255,255,0.2);
            width: 36px;
            height: 36px;
            border-radius: 20px;
            border: none;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }

        /* ===== MAIN LAYOUT ===== */
        .chat-layout {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        /* ===== SIDEBAR (daftar chat) ===== */
        .sidebar-chat {
            width: 300px;
            min-width: 240px;
            background: var(--surface);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            flex-shrink: 0;
        }
        .sidebar-header {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border);
            font-weight: 600;
            font-size: 0.9rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }
        .sidebar-header .count {
            background: var(--primary);
            color: white;
            border-radius: 20px;
            padding: 2px 10px;
            font-size: 0.75rem;
        }
        .room-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px 0;
        }
        .room-item {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            cursor: pointer;
            border-bottom: 1px solid var(--border);
            transition: background 0.2s;
            gap: 12px;
            position: relative;
        }
        .room-item:hover { background: var(--background); }
        .room-item.active { background: var(--primary-light); opacity: 0.9; }
        body.dark-mode .room-item.active { background: #3a2a1a; }

        .room-avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: var(--primary);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.1rem;
            flex-shrink: 0;
        }
        .room-info {
            flex: 1;
            min-width: 0;
        }
        .room-name {
            font-weight: 600;
            font-size: 0.95rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .room-last-msg {
            font-size: 0.8rem;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .room-time {
            font-size: 0.65rem;
            color: var(--text-secondary);
            flex-shrink: 0;
            margin-left: 4px;
        }
        .room-badge {
            background: var(--primary);
            color: white;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.65rem;
            font-weight: bold;
            flex-shrink: 0;
        }
        .room-status {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 4px;
        }
        .room-status.online { background: var(--online); }
        .room-status.offline { background: var(--offline); }

        /* ===== MAIN CHAT AREA ===== */
        .main-chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--background);
            overflow: hidden;
        }
        .chat-header {
            padding: 12px 20px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }
        .chat-header .info h4 { font-size: 1rem; }
        .chat-header .info small { color: var(--text-secondary); font-size: 0.8rem; }

        .messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .empty-chat {
            text-align: center;
            color: var(--text-secondary);
            margin-top: 40px;
        }
        .message {
            max-width: 75%;
            padding: 10px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            word-wrap: break-word;
            position: relative;
        }
        .message-cs {
            align-self: flex-end;
            background: var(--bubble-cs);
            color: var(--text-primary);
            border-bottom-right-radius: 4px;
        }
        .message-customer {
            align-self: flex-start;
            background: var(--bubble-customer);
            color: var(--text-primary);
            border-bottom-left-radius: 4px;
        }
        .message-time {
            font-size: 0.65rem;
            color: var(--text-secondary);
            margin-top: 4px;
            text-align: right;
        }
        .message .read-status {
            font-size: 0.6rem;
            color: var(--text-secondary);
            margin-left: 6px;
        }

        .input-area {
            display: flex;
            gap: 12px;
            padding: 12px 20px;
            background: var(--surface);
            border-top: 1px solid var(--border);
            flex-shrink: 0;
        }
        .input-area input {
            flex: 1;
            padding: 12px 18px;
            border-radius: 30px;
            border: 1px solid var(--border);
            background: var(--background);
            color: var(--text-primary);
            outline: none;
            font-size: 0.95rem;
        }
        .input-area input:focus { border-color: var(--primary); }
        .input-area button {
            background: var(--primary);
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 30px;
            color: white;
            font-size: 20px;
            cursor: pointer;
            transition: 0.2s;
        }
        .input-area button:active { transform: scale(0.95); }
        .input-area button:disabled { opacity: 0.5; cursor: not-allowed; }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .sidebar-chat { width: 100%; max-height: 40vh; border-right: none; border-bottom: 1px solid var(--border); }
            .chat-layout { flex-direction: column; }
            .main-chat { flex: 1; }
        }

        /* ===== LOGIN OVERLAY ===== */
        .login-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(6px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 999;
        }
        .login-overlay.active { display: flex; }
        .login-box {
            background: var(--surface);
            padding: 40px 32px;
            border-radius: 32px;
            max-width: 380px;
            width: 90%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .login-box h2 { color: var(--primary); margin-bottom: 8px; }
        .login-box p { color: var(--text-secondary); margin-bottom: 20px; font-size: 0.9rem; }
        .login-box input {
            width: 100%;
            padding: 14px 16px;
            border-radius: 30px;
            border: 1px solid var(--border);
            background: var(--background);
            color: var(--text-primary);
            margin-bottom: 12px;
            font-size: 1rem;
        }
        .login-box button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 30px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
        }
        .login-box .error-msg {
            color: #F44336;
            font-size: 0.85rem;
            margin-top: 8px;
            display: none;
        }

        /* ===== TOAST ===== */
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.85);
            color: #fff;
            padding: 10px 20px;
            border-radius: 12px;
            font-size: 0.85rem;
            z-index: 9999;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            max-width: 90%;
        }
        .toast.show { opacity: 1; }
        .toast.error { background: rgba(200, 30, 30, 0.9); }
        .toast.success { background: rgba(30, 150, 30, 0.9); }
    </style>
</head>
<body>

<!-- ===== APP BAR ===== -->
<div class="app-bar">
    <button class="back-btn" onclick="window.location.href='dashboard_cs.html'"><i class="fas fa-arrow-left"></i></button>
    <h2><i class="fas fa-headset"></i> Live Chat CS</h2>
    <span class="badge-cs" id="csNameBadge">CS</span>
    <button class="dark-toggle" id="darkToggle"><i class="fas fa-moon"></i></button>
</div>

<!-- ===== CHAT LAYOUT ===== -->
<div class="chat-layout">

    <!-- SIDEBAR -->
    <div class="sidebar-chat">
        <div class="sidebar-header">
            <span>💬 Daftar Chat</span>
            <span class="count" id="roomCount">0</span>
        </div>
        <div class="room-list" id="roomList">
            <div style="padding:20px;text-align:center;color:var(--text-secondary);">
                <i class="fas fa-spinner fa-spin"></i> Memuat...
            </div>
        </div>
    </div>

    <!-- MAIN CHAT -->
    <div class="main-chat">
        <div class="chat-header">
            <div class="info">
                <h4 id="chatCustomerName">Pilih chat di samping</h4>
                <small id="chatCustomerStatus">Belum ada percakapan</small>
            </div>
        </div>
        <div class="messages-area" id="messagesArea">
            <div class="empty-chat">👈 Pilih percakapan untuk mulai membalas</div>
        </div>
        <div class="input-area">
            <input type="text" id="messageInput" placeholder="Ketik balasan..." disabled>
            <button id="sendBtn" disabled><i class="fas fa-paper-plane"></i></button>
        </div>
    </div>
</div>

<!-- ===== TOAST ===== -->
<div id="toast" class="toast"></div>

<!-- ===== LOGIN OVERLAY ===== -->
<div class="login-overlay" id="loginOverlay">
    <div class="login-box">
        <h2>🔐 Login CS</h2>
        <p>Masuk dengan akun CS JeGo</p>
        <input type="email" id="loginEmail" placeholder="Email CS" value="cs@jego.com">
        <input type="password" id="loginPassword" placeholder="Password">
        <button id="loginBtn">Masuk</button>
        <div class="error-msg" id="loginError">Email atau password salah</div>
        <div style="margin-top:16px;font-size:0.8rem;color:var(--text-secondary);">
            <a href="#" id="logoutLink" style="color:var(--primary);text-decoration:none;">Logout</a>
        </div>
    </div>
</div>

<script>
    // ==================== FIREBASE ====================
    const firebaseConfig = {
        apiKey: "AIzaSyCD0pgeZio-LdKqYDtWxcdXcZwyL4ngYQI",
        authDomain: "jego-35a2b.firebaseapp.com",
        databaseURL: "https://jego-35a2b-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "jego-35a2b",
        storageBucket: "jego-35a2b.firebasestorage.app",
        messagingSenderId: "600037007040",
        appId: "1:600037007040:web:ac3243ad9b472647ffd725"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    // ==================== STATE ====================
    let currentUser = null;
    let currentRoomId = null;
    let currentRoomName = '';
    let allRooms = {};
    let messagesRef = null;
    let roomsRef = null;
    let isProcessing = false;
    let isDark = localStorage.getItem('jego_dark_mode') === 'true';

    // ==================== DOM REFS ====================
    const roomList = document.getElementById('roomList');
    const messagesArea = document.getElementById('messagesArea');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    const chatCustomerName = document.getElementById('chatCustomerName');
    const chatCustomerStatus = document.getElementById('chatCustomerStatus');
    const roomCount = document.getElementById('roomCount');
    const csNameBadge = document.getElementById('csNameBadge');
    const toast = document.getElementById('toast');
    const loginOverlay = document.getElementById('loginOverlay');
    const loginEmail = document.getElementById('loginEmail');
    const loginPassword = document.getElementById('loginPassword');
    const loginBtn = document.getElementById('loginBtn');
    const loginError = document.getElementById('loginError');
    const logoutLink = document.getElementById('logoutLink');

    // ==================== DARK MODE ====================
    function applyDarkMode() {
        if (isDark) document.body.classList.add('dark-mode');
        else document.body.classList.remove('dark-mode');
        document.getElementById('darkToggle').innerHTML = isDark ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
    }
    applyDarkMode();
    document.getElementById('darkToggle').onclick = () => {
        isDark = !isDark;
        localStorage.setItem('jego_dark_mode', isDark);
        applyDarkMode();
    };

    // ==================== TOAST ====================
    function showToast(msg, type = 'info') {
        toast.textContent = msg;
        toast.className = 'toast show ' + type;
        clearTimeout(toast._hide);
        toast._hide = setTimeout(() => toast.classList.remove('show'), 3500);
    }

    // ==================== AUTH ====================
    function showLogin() { loginOverlay.classList.add('active'); }
    function hideLogin() { loginOverlay.classList.remove('active'); }

    async function doLogin(email, pass) {
        loginError.style.display = 'none';
        try {
            const cred = await auth.signInWithEmailAndPassword(email, pass);
            showToast('✅ Login berhasil!', 'success');
            hideLogin();
            return true;
        } catch (err) {
            loginError.textContent = err.message;
            loginError.style.display = 'block';
            showToast('❌ ' + err.message, 'error');
            return false;
        }
    }

    async function doLogout() {
        await auth.signOut();
        currentUser = null;
        clearRooms();
        showLogin();
        showToast('👋 Logout berhasil', 'info');
    }

    // ==================== ROOM LIST ====================
    function clearRooms() {
        if (roomsRef) { roomsRef.off(); roomsRef = null; }
        if (messagesRef) { messagesRef.off(); messagesRef = null; }
        roomList.innerHTML = '<div style="padding:20px;text-align:center;color:var(--text-secondary);">Belum ada chat</div>';
        messagesArea.innerHTML = '<div class="empty-chat">👈 Pilih percakapan</div>';
        chatCustomerName.textContent = 'Belum dipilih';
        chatCustomerStatus.textContent = 'Silakan pilih chat di samping';
        messageInput.disabled = true;
        sendBtn.disabled = true;
        currentRoomId = null;
        roomCount.textContent = '0';
    }

    function renderRooms(rooms) {
        allRooms = rooms || {};
        const roomIds = Object.keys(allRooms);
        roomCount.textContent = roomIds.length;

        if (roomIds.length === 0) {
            roomList.innerHTML = '<div style="padding:20px;text-align:center;color:var(--text-secondary);">Belum ada customer chat</div>';
            return;
        }

        // Urutkan berdasarkan last_message_time terbaru
        const sorted = roomIds.sort((a, b) => {
            const ta = allRooms[a].last_message_time || 0;
            const tb = allRooms[b].last_message_time || 0;
            return tb - ta;
        });

        let html = '';
        sorted.forEach(roomId => {
            const room = allRooms[roomId];
            const name = room.customer_name || 'Customer';
            const lastMsg = room.last_message || 'Tidak ada pesan';
            const lastTime = room.last_message_time ? new Date(room.last_message_time) : null;
            const timeStr = lastTime ? lastTime.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) : '';
            const isActive = roomId === currentRoomId;

            // Hitung unread (pesan customer yang belum dibaca oleh CS)
            let unread = 0;
            if (room.messages) {
                const msgs = Object.values(room.messages);
                unread = msgs.filter(m => m.sender === 'customer' && m.read !== true).length;
            }

            const initial = name.charAt(0).toUpperCase();

            html += `
                <div class="room-item ${isActive ? 'active' : ''}" data-room="${roomId}">
                    <div class="room-avatar">${initial}</div>
                    <div class="room-info">
                        <div class="room-name">${escapeHtml(name)}</div>
                        <div class="room-last-msg">${escapeHtml(lastMsg.substring(0, 50))}</div>
                    </div>
                    <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0;">
                        ${timeStr ? `<div class="room-time">${timeStr}</div>` : ''}
                        ${unread > 0 ? `<div class="room-badge">${unread}</div>` : ''}
                    </div>
                </div>
            `;
        });
        roomList.innerHTML = html;

        // Event click room
        document.querySelectorAll('.room-item').forEach(el => {
            el.addEventListener('click', () => {
                const roomId = el.dataset.room;
                if (roomId) selectRoom(roomId);
            });
        });
    }

    function listenRooms() {
        if (roomsRef) roomsRef.off();
        roomsRef = db.ref('chat_rooms');
        roomsRef.on('value', (snap) => {
            const data = snap.val() || {};
            // Filter hanya room yang punya customer_id
            const filtered = {};
            Object.keys(data).forEach(key => {
                if (data[key].customer_id) filtered[key] = data[key];
            });
            renderRooms(filtered);
        }, (err) => {
            showToast('❌ Gagal load chat: ' + err.message, 'error');
        });
    }

    // ==================== SELECT ROOM ====================
    function selectRoom(roomId) {
        if (currentRoomId === roomId) return;
        currentRoomId = roomId;
        const room = allRooms[roomId] || {};
        currentRoomName = room.customer_name || 'Customer';

        // Update header
        chatCustomerName.textContent = currentRoomName;
        chatCustomerStatus.textContent = '💬 Online';
        messageInput.disabled = false;
        sendBtn.disabled = false;
        messageInput.focus();

        // Highlight active
        document.querySelectorAll('.room-item').forEach(el => {
            el.classList.toggle('active', el.dataset.room === roomId);
        });

        // Load messages
        loadMessages(roomId);

        // Tandai semua pesan customer sebagai sudah dibaca (read = true)
        markAllRead(roomId);
    }

    function loadMessages(roomId) {
        if (messagesRef) messagesRef.off();
        messagesRef = db.ref(`chat_rooms/${roomId}/messages`);
        messagesRef.on('value', (snap) => {
            const msgs = snap.val() || {};
            const list = Object.entries(msgs)
                .map(([key, val]) => ({ id: key, ...val }))
                .sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));

            if (list.length === 0) {
                messagesArea.innerHTML = '<div class="empty-chat">Belum ada pesan di percakapan ini</div>';
                return;
            }

            let html = '';
            list.forEach(msg => {
                const isCS = msg.sender === 'cs';
                const time = msg.timestamp ? new Date(msg.timestamp).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) : '';
                html += `
                    <div class="message ${isCS ? 'message-cs' : 'message-customer'}">
                        ${escapeHtml(msg.text)}
                        <div class="message-time">
                            ${time}
                            ${isCS ? '' : (msg.read ? '✅ Dibaca' : '⏳')}
                        </div>
                    </div>
                `;
            });
            messagesArea.innerHTML = html;
            messagesArea.scrollTop = messagesArea.scrollHeight;

            // Mark read untuk pesan customer jika room sedang aktif
            if (currentRoomId === roomId) {
                markAllRead(roomId);
            }
        }, (err) => {
            showToast('❌ Gagal baca pesan: ' + err.message, 'error');
        });
    }

    async function markAllRead(roomId) {
        try {
            const snap = await db.ref(`chat_rooms/${roomId}/messages`).once('value');
            const msgs = snap.val() || {};
            const updates = {};
            Object.keys(msgs).forEach(key => {
                if (msgs[key].sender === 'customer' && msgs[key].read !== true) {
                    updates[`${key}/read`] = true;
                }
            });
            if (Object.keys(updates).length > 0) {
                await db.ref(`chat_rooms/${roomId}/messages`).update(updates);
            }
        } catch (err) {
            console.warn('Gagal mark read:', err);
        }
    }

    // ==================== SEND MESSAGE (CS) ====================
    async function sendMessage(text) {
        if (!text.trim()) return;
        if (!currentRoomId) {
            showToast('❌ Pilih percakapan terlebih dahulu', 'error');
            return;
        }
        if (!currentUser) {
            showToast('❌ Anda belum login', 'error');
            return;
        }
        if (isProcessing) return;
        isProcessing = true;

        try {
            const msgRef = db.ref(`chat_rooms/${currentRoomId}/messages`).push();
            await msgRef.set({
                text: text.trim(),
                sender: 'cs',
                sender_id: currentUser.uid,
                sender_name: currentUser.displayName || 'CS JeGo',
                timestamp: Date.now(),
                read: true // pesan dari CS otomatis terbaca
            });
            await db.ref(`chat_rooms/${currentRoomId}`).update({
                last_message: text.trim(),
                last_message_time: Date.now(),
                last_sender: 'cs'
            });
            messageInput.value = '';
            showToast('✅ Pesan terkirim', 'success');
        } catch (err) {
            showToast('❌ Gagal kirim: ' + err.message, 'error');
        }
        isProcessing = false;
    }

    // ==================== HELPERS ====================
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, m => m==='&'?'&amp;':m==='<'?'&lt;':'&gt;');
    }

    // ==================== AUTH STATE (SINKRON dengan dashboard_cs.html) ====================
    auth.onAuthStateChanged(async (user) => {
        if (user) {
            // Cek apakah user terdaftar di node admins (sama dengan dashboard_cs.html)
            try {
                const snap = await db.ref(`admins/${user.uid}`).once('value');
                const data = snap.val();
                if (!data) {
                    showToast('⚠️ Akun Anda bukan CS. Logout...', 'error');
                    await auth.signOut();
                    showLogin();
                    return;
                }
                currentUser = user;
                csNameBadge.textContent = data.name || 'CS';
                hideLogin();
                showToast('✅ Login sebagai ' + (data.name || 'CS'), 'success');
                listenRooms();
            } catch (err) {
                showToast('❌ Gagal verifikasi: ' + err.message, 'error');
                showLogin();
            }
        } else {
            currentUser = null;
            clearRooms();
            showLogin();
        }
    });

    // ==================== EVENT LISTENERS ====================
    sendBtn.addEventListener('click', () => sendMessage(messageInput.value));
    messageInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendMessage(messageInput.value);
    });

    loginBtn.addEventListener('click', () => {
        const email = loginEmail.value.trim();
        const pass = loginPassword.value.trim();
        if (email && pass) doLogin(email, pass);
        else showToast('❌ Isi email dan password', 'error');
    });
    loginPassword.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') loginBtn.click();
    });

    logoutLink.addEventListener('click', (e) => {
        e.preventDefault();
        doLogout();
    });

    // ==================== INIT ====================
    setTimeout(() => {
        if (!currentUser) showLogin();
    }, 500);

    console.log('✅ CS Live Chat siap (sinkron dengan dashboard_cs.html)');
</script>
</body>
</html>
