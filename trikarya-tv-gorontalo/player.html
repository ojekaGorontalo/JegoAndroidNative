<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Player Olahraga Internasional + Console Log</title>

    <!-- Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.12/shaka-player.compiled.js">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@0.14.17/dist/hls.min.js">
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mpegts.js/0.16.6/mpegts.js">
    </script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #0a0a0a;
            color: #fff;
            display: flex;
            justify-content: center;
            padding: 16px;
        }
        .container {
            max-width: 1200px;
            width: 100%;
        }
        .header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 8px 16px;
            background: #111;
            padding: 10px 18px;
            border-radius: 12px;
            border: 1px solid #2a2a2a;
            margin-bottom: 14px;
        }
        .header-title {
            font-size: 20px;
            font-weight: 700;
            color: #00d4ff;
        }
        .upload-btn {
            background: #00d4ff;
            color: #0a0a0a;
            border: none;
            padding: 7px 18px;
            border-radius: 30px;
            font-weight: 700;
            cursor: pointer;
        }
        .file-info {
            color: #aaa;
            font-size: 13px;
            background: #1a1a1a;
            padding: 4px 14px;
            border-radius: 20px;
            border: 1px solid #2a2a2a;
        }
        #fileInput {
            display: none;
        }
        #videoContainer {
            background: #111;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #2a2a2a;
            margin-bottom: 10px;
        }
        video {
            width: 100%;
            display: block;
            max-height: 500px;
            background: #000;
        }
        #status {
            padding: 8px 14px;
            border-radius: 8px;
            background: #1a1a1a;
            min-height: 38px;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 12px;
            border: 1px solid #2a2a2a;
            font-size: 14px;
            font-family: 'Courier New', monospace;
        }
        .status-loading {
            color: #ffcc00;
        }
        .status-error {
            color: #ff4444;
        }
        .status-playing {
            color: #00ff88;
        }
        .status-idle {
            color: #888;
        }
        .retry-btn {
            background: #00d4ff;
            color: #0a0a0a;
            border: none;
            padding: 4px 16px;
            border-radius: 20px;
            cursor: pointer;
        }
        .search-bar input {
            width: 100%;
            padding: 10px 16px;
            border-radius: 30px;
            border: 1px solid #2a2a2a;
            background: #111;
            color: #fff;
            font-size: 14px;
            outline: none;
            margin-bottom: 12px;
        }
        .search-bar input:focus {
            border-color: #00d4ff;
        }
        .channel-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 12px;
            padding: 4px 0;
        }
        .channel-card {
            background: #1a1a1a;
            border: 2px solid #2a2a2a;
            border-radius: 12px;
            padding: 12px 8px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
        }
        .channel-card:hover {
            border-color: #00d4ff;
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 212, 255, 0.10);
        }
        .channel-card.active {
            border-color: #00d4ff;
            background: rgba(0, 212, 255, 0.12);
        }
        .channel-card img {
            width: 60px;
            height: 60px;
            border-radius: 8px;
            object-fit: cover;
            background: #0a0a0a;
            border: 1px solid #2a2a2a;
        }
        .channel-card .name {
            font-size: 12px;
            font-weight: 600;
            margin-top: 6px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .no-result {
            grid-column: 1 / -1;
            text-align: center;
            color: #555;
            padding: 30px 0;
            border: 1px dashed #2a2a2a;
            border-radius: 10px;
        }
        #logContainer {
            margin-top: 16px;
            background: #0d0d0d;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            padding: 10px;
            max-height: 200px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: #aaa;
        }
        #logContainer .log-entry {
            padding: 2px 0;
            border-bottom: 1px solid #1a1a1a;
        }
        .log-time {
            color: #666;
            margin-right: 8px;
        }
        .log-info {
            color: #00d4ff;
        }
        .log-success {
            color: #00ff88;
        }
        .log-error {
            color: #ff4444;
        }
        .log-warn {
            color: #ffcc00;
        }
        @media (max-width: 600px) {
            .channel-grid {
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            }
            .channel-card img {
                width: 44px;
                height: 44px;
            }
            .channel-card .name {
                font-size: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">

        <div class="header">
            <div class="header-title">⚽ Player Olahraga + Console Log</div>
            <div style="display:flex; gap:8px; flex-wrap:wrap;">
                <button class="upload-btn" id="uploadBtn">📤 Upload M3U</button>
                <input type="file" id="fileInput" accept=".m3u,.m3u8,.txt" />
                <span class="file-info">📄 <span id="fileName">Belum ada file</span></span>
            </div>
        </div>

        <div id="videoContainer">
            <video id="videoPlayer" controls playsinline></video>
        </div>

        <div id="status" class="status-idle">📤 Upload file M3U untuk mulai</div>

        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="🔍 Cari channel..." />
        </div>

        <div id="channelGrid" class="channel-grid">
            <div class="no-result">Belum ada channel</div>
        </div>

        <!-- LOG CONTAINER -->
        <div id="logContainer">
            <div class="log-entry"><span class="log-time">[System]</span> <span class="log-info">Menunggu upload file...</span></div>
        </div>

    </div>

    <script>
        // ============================================================
        //  LOGGING SYSTEM
        // ============================================================
        const logContainer = document.getElementById('logContainer');

        function addLog(message, type = 'info') {
            const time = new Date().toLocaleTimeString();
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            const cls = type === 'error' ? 'log-error' : type === 'success' ? 'log-success' : type === 'warn' ?
                'log-warn' : 'log-info';
            entry.innerHTML = `<span class="log-time">[${time}]</span> <span class="${cls}">${message}</span>`;
            logContainer.appendChild(entry);
            logContainer.scrollTop = logContainer.scrollHeight;
            // Juga kirim ke console browser
            console.log(`[${time}] ${message}`);
        }

        // ============================================================
        //  GLOBAL
        // ============================================================
        const video = document.getElementById('videoPlayer');
        const statusEl = document.getElementById('status');
        const grid = document.getElementById('channelGrid');
        const searchInput = document.getElementById('searchInput');
        const fileInput = document.getElementById('fileInput');
        const fileName = document.getElementById('fileName');

        let channels = [];
        let filteredChannels = [];
        let currentIndex = -1;

        let shakaPlayer = null;
        let hlsPlayer = null;
        let mpegtsPlayer = null;
        let isPlaying = false;

        // ============================================================
        //  PARSER M3U
        // ============================================================
        function parseM3U(content) {
            addLog('📄 Memulai parsing M3U...', 'info');
            const lines = content.split(/\r?\n/);
            const result = [];
            let current = {};

            for (let i = 0; i < lines.length; i++) {
                let line = lines[i].trim();
                if (!line) continue;
                if (line.startsWith('#') && !line.startsWith('#EXTINF') && !line.startsWith('#KODIPROP') && !line
                    .startsWith('#EXTVLCOPT')) continue;

                if (line.startsWith('#EXTINF:')) {
                    const nameMatch = line.match(/,([^,]*)$/);
                    const name = nameMatch ? nameMatch[1].trim() : 'Channel';
                    const logoMatch = line.match(/tvg-logo="([^"]*)"/);
                    const logo = logoMatch ? logoMatch[1] : '';
                    const groupMatch = line.match(/group-title="([^"]*)"/);
                    const group = groupMatch ? groupMatch[1] : 'Sports';

                    current = {
                        name,
                        logo,
                        group,
                        url: '',
                        keyId: '',
                        key: '',
                        licenseUrl: ''
                    };
                } else if (line.startsWith('#KODIPROP:')) {
                    const prop = line.replace('#KODIPROP:', '').trim();
                    if (prop.includes('license_key=')) {
                        const val = prop.split('license_key=')[1].trim();
                        if (val.startsWith('http')) {
                            current.licenseUrl = val;
                        } else {
                            const parts = val.split(':');
                            if (parts.length === 2) {
                                current.keyId = parts[0].trim();
                                current.key = parts[1].trim();
                            }
                        }
                    } else if (prop.includes('license_url=')) {
                        current.licenseUrl = prop.split('license_url=')[1].trim();
                    }
                } else if (line.startsWith('http://') || line.startsWith('https://')) {
                    if (current.name) {
                        current.url = line;
                        result.push({ ...current });
                        current = {};
                    }
                }
            }
            if (current.name && current.url) result.push(current);
            addLog(`✅ Parsing selesai: ${result.length} channel ditemukan`, 'success');
            return result;
        }

        // ============================================================
        //  DETECT STREAM TYPE
        // ============================================================
        function detectType(url) {
            const u = url.toLowerCase();
            if (u.includes('.mpd') || u.includes('manifest.mpd') || u.includes('cenc.mpd')) return 'dash';
            if (u.includes('.m3u8') || u.includes('playlist.m3u8')) return 'hls';
            if (u.includes('.ts') || u.includes('extension=ts')) return 'mpegts';
            return 'hls';
        }

        // ============================================================
        //  DESTROY PLAYERS
        // ============================================================
        function destroyAll() {
            addLog('🧹 Menghancurkan semua player...', 'warn');
            if (shakaPlayer) { try { shakaPlayer.destroy(); } catch (e) { addLog('⚠️ Error destroy Shaka: ' + e.message,
                    'error'); } shakaPlayer = null; }
            if (hlsPlayer) { try { hlsPlayer.destroy(); } catch (e) { addLog('⚠️ Error destroy HLS: ' + e.message,
                    'error'); } hlsPlayer = null; }
            if (mpegtsPlayer) { try { mpegtsPlayer.destroy(); } catch (e) { addLog('⚠️ Error destroy MPEGTS: ' + e.message,
                    'error'); } mpegtsPlayer = null; }
            video.pause();
            video.removeAttribute('src');
            video.load();
            addLog('✅ Semua player dihancurkan', 'success');
        }

        // ============================================================
        //  PLAY CHANNEL
        // ============================================================
        async function playChannel(index) {
            if (isPlaying) {
                addLog('⏳ Masih ada pemutaran berjalan, tunggu...', 'warn');
                return;
            }
            const ch = filteredChannels[index] || channels[index];
            if (!ch || !ch.url) {
                addLog('❌ Channel tidak valid (index=' + index + ')', 'error');
                setStatus('⚠️ Channel tidak valid', 'error');
                return;
            }

            isPlaying = true;
            currentIndex = index;
            addLog(`▶️ [PLAY] Memutar: ${ch.name} (${ch.url})`, 'info');
            setStatus(`⏳ Memuat ${ch.name} ...`, 'loading');

            // Highlight
            document.querySelectorAll('.channel-card').forEach((el, i) => {
                el.classList.toggle('active', i === index);
            });

            destroyAll();

            try {
                const type = detectType(ch.url);
                addLog(`📡 Tipe stream terdeteksi: ${type}`, 'info');

                if (type === 'dash') {
                    addLog('🎬 Menggunakan Shaka Player untuk DASH...', 'info');
                    shakaPlayer = new shaka.Player();
                    const drm = {};
                    if (ch.keyId && ch.key) {
                        drm.clearKeys = { [ch.keyId]: ch.key };
                        addLog(`🔑 ClearKey: ${ch.keyId}:${ch.key}`, 'info');
                    }
                    if (ch.licenseUrl) {
                        drm.servers = { 'com.widevine.alpha': ch.licenseUrl };
                        addLog(`🔑 License URL: ${ch.licenseUrl}`, 'info');
                    }
                    shakaPlayer.configure({
                        drm,
                        manifest: { retryParameters: { maxAttempts: 3, timeout: 20000 } },
                        streaming: { retryParameters: { maxAttempts: 3, timeout: 20000 } }
                    });
                    await shakaPlayer.attach(video);
                    shakaPlayer.getNetworkingEngine().registerRequestFilter((type, req) => {
                        req.headers['User-Agent'] = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36';
                        req.headers['Referer'] = 'https://www.visionplus.id/';
                    });
                    addLog(`📥 Mencoba load manifest: ${ch.url}`, 'info');
                    await shakaPlayer.load(ch.url);
                    addLog('✅ Manifest berhasil dimuat', 'success');
                    await video.play();
                    addLog(`▶️ [PLAY] Berhasil memutar ${ch.name}`, 'success');
                    setStatus(`▶️ ${ch.name}`, 'playing');
                    isPlaying = false;
                    return;
                }

                if (type === 'hls') {
                    addLog('🎬 Menggunakan HLS.js untuk HLS...', 'info');
                    if (Hls.isSupported()) {
                        hlsPlayer = new Hls({
                            xhrSetup: (xhr) => {
                                xhr.setRequestHeader('User-Agent', 'Mozilla/5.0');
                            }
                        });
                        hlsPlayer.loadSource(ch.url);
                        hlsPlayer.attachMedia(video);
                        hlsPlayer.on(Hls.Events.MANIFEST_PARSED, () => {
                            addLog('✅ Manifest HLS berhasil diparsing', 'success');
                            video.play();
                            addLog(`▶️ [PLAY] Berhasil memutar ${ch.name}`, 'success');
                            setStatus(`▶️ ${ch.name}`, 'playing');
                            isPlaying = false;
                        });
                        hlsPlayer.on(Hls.Events.ERROR, (e, data) => {
                            if (data.fatal) {
                                addLog(`❌ Fatal HLS error: ${data.type} - ${data.details}`, 'error');
                                setStatus('⚠️ Gagal memutar (HLS error)', 'error');
                                isPlaying = false;
                            } else {
                                addLog(`⚠️ HLS non-fatal error: ${data.type} - ${data.details}`, 'warn');
                            }
                        });
                        return;
                    } else {
                        addLog('⚠️ HLS.js tidak didukung, fallback ke native', 'warn');
                        video.src = ch.url;
                        video.play();
                        addLog(`▶️ [PLAY] Berhasil memutar ${ch.name} (native)`, 'success');
                        setStatus(`▶️ ${ch.name}`, 'playing');
                        isPlaying = false;
                        return;
                    }
                }

                // MPEG-TS fallback
                addLog('🎬 Menggunakan native video untuk MPEG-TS/unknown', 'info');
                video.src = ch.url;
                video.play();
                addLog(`▶️ [PLAY] Berhasil memutar ${ch.name} (native)`, 'success');
                setStatus(`▶️ ${ch.name}`, 'playing');
                isPlaying = false;

            } catch (err) {
                addLog(`❌ [ERROR] ${err.message || 'Gagal memutar'}`, 'error');
                console.error('Full error:', err);
                setStatus(`❌ ${err.message || 'Gagal memutar'}`, 'error');
                isPlaying = false;
            }
        }

        // ============================================================
        //  SET STATUS
        // ============================================================
        function setStatus(text, cls = 'idle') {
            statusEl.textContent = text;
            statusEl.className = 'status-' + cls;
        }

        // ============================================================
        //  RENDER GRID
        // ============================================================
        function render(filter = '') {
            const q = filter.toLowerCase().trim();
            filteredChannels = q ? channels.filter(c => c.name.toLowerCase().includes(q)) : channels;

            if (filteredChannels.length === 0) {
                grid.innerHTML = `<div class="no-result">${q ? '🔍 Tidak ada channel cocok' : '📭 Belum ada channel'}</div>`;
                return;
            }

            let html = '';
            filteredChannels.forEach((ch, idx) => {
                const logo = ch.logo ? `<img src="${ch.logo}" alt="" onerror="this.style.display='none'" />` :
                    `<div style="width:60px;height:60px;border-radius:8px;background:#1a1a1a;border:1px solid #2a2a2a;display:flex;align-items:center;justify-content:center;font-size:24px;margin:0 auto;">📺</div>`;
                html += `
                    <div class="channel-card" data-index="${idx}">
                        ${logo}
                        <div class="name">${ch.name}</div>
                    </div>
                `;
            });
            grid.innerHTML = html;

            document.querySelectorAll('.channel-card').forEach(el => {
                el.addEventListener('click', function() {
                    const idx = parseInt(this.dataset.index);
                    playChannel(idx);
                });
            });
        }

        // ============================================================
        //  LOAD FROM M3U CONTENT
        // ============================================================
        function loadFromContent(content, name = '') {
            channels = parseM3U(content);
            if (channels.length === 0) {
                addLog('❌ Tidak ada channel ditemukan dalam file', 'error');
                setStatus('⚠️ Tidak ada channel ditemukan', 'error');
                fileName.textContent = 'File tidak valid';
                return;
            }
            fileName.textContent = name || 'popular-sport.txt';
            addLog(`✅ ${channels.length} channel berhasil dimuat`, 'success');
            setStatus(`✅ ${channels.length} channel dimuat`, 'idle');
            render('');
        }

        // ============================================================
        //  UPLOAD HANDLER
        // ============================================================
        document.getElementById('uploadBtn').addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', function(e) {
            const file = this.files[0];
            if (!file) return;
            addLog(`📤 Upload file: ${file.name} (${(file.size/1024).toFixed(1)} KB)`, 'info');
            const reader = new FileReader();
            reader.onload = (ev) => {
                loadFromContent(ev.target.result, file.name);
            };
            reader.onerror = () => {
                addLog('❌ Gagal membaca file', 'error');
            };
            reader.readAsText(file);
        });

        // ============================================================
        //  SEARCH
        // ============================================================
        searchInput.addEventListener('input', function() {
            render(this.value);
        });

        // ============================================================
        //  CLEANUP
        // ============================================================
        window.addEventListener('beforeunload', destroyAll);

        // ============================================================
        //  INIT
        // ============================================================
        addLog('🚀 Player siap. Upload file M3U untuk mulai.', 'info');
        setStatus('📤 Upload file M3U (popular-sport.txt) untuk mulai', 'idle');
        grid.innerHTML = `<div class="no-result">📤 Upload file M3U terlebih dahulu</div>`;
    </script>
</body>
</html>
