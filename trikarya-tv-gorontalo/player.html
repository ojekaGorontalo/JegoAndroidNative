<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Player Olahraga + Instant Switch</title>

    <!-- Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.12/shaka-player.compiled.js">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@0.14.17/dist/hls.min.js">
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mpegts.js/0.16.6/mpegts.js">
    </script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #0a0a0a;
            color: #fff;
            display: flex;
            justify-content: center;
            padding: 16px;
        }
        .container {
            max-width: 1200px;
            width: 100%;
        }
        .header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 8px 16px;
            background: #111;
            padding: 10px 18px;
            border-radius: 12px;
            border: 1px solid #2a2a2a;
            margin-bottom: 14px;
        }
        .header-title {
            font-size: 20px;
            font-weight: 700;
            color: #00d4ff;
        }
        .upload-btn {
            background: #00d4ff;
            color: #0a0a0a;
            border: none;
            padding: 7px 18px;
            border-radius: 30px;
            font-weight: 700;
            cursor: pointer;
        }
        .file-info {
            color: #aaa;
            font-size: 13px;
            background: #1a1a1a;
            padding: 4px 14px;
            border-radius: 20px;
            border: 1px solid #2a2a2a;
        }
        #fileInput {
            display: none;
        }

        #videoContainer {
            background: #111;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #2a2a2a;
            margin-bottom: 10px;
            position: relative;
            min-height: 280px;
        }
        video {
            width: 100%;
            display: block;
            max-height: 500px;
            background: #000;
        }

        video::-webkit-media-controls-timeline {
            display: none !important;
        }
        video::-webkit-media-controls-current-time-display,
        video::-webkit-media-controls-time-remaining-display {
            display: none !important;
        }
        video::-webkit-media-controls-seek-backward-button,
        video::-webkit-media-controls-seek-forward-button {
            display: none !important;
        }
        video::-moz-range-track {
            display: none !important;
        }
        video::-webkit-media-controls-panel {
            display: flex !important;
        }

        #status {
            padding: 6px 14px;
            border-radius: 8px;
            background: #1a1a1a;
            min-height: 32px;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 12px;
            border: 1px solid #2a2a2a;
            font-size: 13px;
            font-family: 'Courier New', monospace;
        }
        .status-loading {
            color: #ffcc00;
        }
        .status-error {
            color: #ff4444;
        }
        .status-playing {
            color: #00ff88;
        }
        .status-idle {
            color: #888;
        }

        #loadingIndicator {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 14px;
            background: rgba(0, 0, 0, 0.7);
            padding: 8px 16px;
            border-radius: 8px;
            z-index: 10;
            pointer-events: none;
        }

        .search-bar input {
            width: 100%;
            padding: 10px 16px;
            border-radius: 30px;
            border: 1px solid #2a2a2a;
            background: #111;
            color: #fff;
            font-size: 14px;
            outline: none;
            margin-bottom: 12px;
        }
        .search-bar input:focus {
            border-color: #00d4ff;
        }

        .channel-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 12px;
            padding: 4px 0;
        }
        .channel-card {
            background: #1a1a1a;
            border: 2px solid #2a2a2a;
            border-radius: 12px;
            padding: 12px 8px;
            text-align: center;
            cursor: pointer;
            transition: 0.15s;
        }
        .channel-card:hover {
            border-color: #00d4ff;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 212, 255, 0.10);
        }
        .channel-card.active {
            border-color: #00d4ff;
            background: rgba(0, 212, 255, 0.12);
        }
        .channel-card img {
            width: 60px;
            height: 60px;
            border-radius: 8px;
            object-fit: cover;
            background: #0a0a0a;
            border: 1px solid #2a2a2a;
        }
        .channel-card .name {
            font-size: 12px;
            font-weight: 600;
            margin-top: 6px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .no-result {
            grid-column: 1 / -1;
            text-align: center;
            color: #555;
            padding: 30px 0;
            border: 1px dashed #2a2a2a;
            border-radius: 10px;
        }

        #logContainer {
            margin-top: 16px;
            background: #0d0d0d;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            padding: 10px;
            max-height: 150px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 11px;
            color: #888;
        }
        #logContainer .log-entry {
            padding: 1px 0;
            border-bottom: 1px solid #1a1a1a;
        }
        .log-time {
            color: #555;
            margin-right: 8px;
        }
        .log-info {
            color: #00d4ff;
        }
        .log-success {
            color: #00ff88;
        }
        .log-error {
            color: #ff4444;
        }
        .log-warn {
            color: #ffcc00;
        }

        @media (max-width: 600px) {
            .channel-grid {
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            }
            .channel-card img {
                width: 44px;
                height: 44px;
            }
            .channel-card .name {
                font-size: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">

        <div class="header">
            <div class="header-title">⚽ Player Sport + Instant Switch</div>
            <div style="display:flex; gap:8px; flex-wrap:wrap;">
                <button class="upload-btn" id="uploadBtn">📤 Upload M3U</button>
                <input type="file" id="fileInput" accept=".m3u,.m3u8,.txt" />
                <span class="file-info">📄 <span id="fileName">Memuat dari Dropbox...</span></span>
            </div>
        </div>

        <div id="videoContainer">
            <div id="loadingIndicator">⏳ Memuat...</div>
            <video id="videoPlayer" controls playsinline controlsList="nodownload noremoteplayback"></video>
        </div>

        <div id="status" class="status-idle">📡 Mengambil daftar channel dari Dropbox...</div>

        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="🔍 Cari channel..." />
        </div>

        <div id="channelGrid" class="channel-grid">
            <div class="no-result">⏳ Memuat channel...</div>
        </div>

        <div id="logContainer">
            <div class="log-entry"><span class="log-time">[System]</span> <span class="log-info">Memulai auto-load dari Dropbox...</span></div>
        </div>

    </div>

    <script>
        // ============================================================
        //  LOGGING
        // ============================================================
        const logContainer = document.getElementById('logContainer');

        function addLog(message, type = 'info') {
            const time = new Date().toLocaleTimeString();
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            const cls = type === 'error' ? 'log-error' : type === 'success' ? 'log-success' : type === 'warn' ?
                'log-warn' : 'log-info';
            entry.innerHTML = `<span class="log-time">[${time}]</span> <span class="${cls}">${message}</span>`;
            logContainer.appendChild(entry);
            logContainer.scrollTop = logContainer.scrollHeight;
            console.log(`[${time}] ${message}`);
        }

        // ============================================================
        //  GLOBAL
        // ============================================================
        const video = document.getElementById('videoPlayer');
        const statusEl = document.getElementById('status');
        const grid = document.getElementById('channelGrid');
        const searchInput = document.getElementById('searchInput');
        const fileInput = document.getElementById('fileInput');
        const fileName = document.getElementById('fileName');
        const loadingIndicator = document.getElementById('loadingIndicator');

        let channels = [];
        let filteredChannels = [];
        let currentIndex = -1;
        let isSwitching = false;
        let switchTimeout = null;

        let shakaPlayer = null;
        let hlsPlayer = null;
        let mpegtsPlayer = null;

        const M3U_URL =
            'https://www.dropbox.com/scl/fi/bmy5q6s7jseaapmakxao2/popular-sports-iptv.m3u?rlkey=2ur64tzoclr6ehltjvov3otba&st=vaqtzoxc&dl=1';

        const PROXY_LIST = [
            'https://api.allorigins.win/raw?url=',
            'https://corsproxy.io/?',
            'https://directv-iptv-player.vercel.app/api/stream?url='
        ];

        // ============================================================
        //  AMBIL M3U
        // ============================================================
        async function fetchM3UFromUrl(url) {
            addLog(`📡 Mencoba mengambil: ${url}`, 'info');
            for (const proxy of ['', ...PROXY_LIST]) {
                try {
                    const finalUrl = proxy ? proxy + encodeURIComponent(url) : url;
                    const response = await fetch(finalUrl, {
                        headers: { 'User-Agent': 'Mozilla/5.0' }
                    });
                    if (response.ok) {
                        const text = await response.text();
                        if (text && text.trim().length > 0 && !text.includes('Dropbox') && !text.includes('<!DOCTYPE')) {
                            addLog(`✅ Berhasil ${proxy ? 'via ' + proxy.split('/')[2] : 'langsung'}`, 'success');
                            return text;
                        }
                    }
                } catch (e) {
                    addLog(`⚠️ ${proxy ? proxy.split('/')[2] : 'langsung'} gagal: ${e.message}`, 'warn');
                }
            }
            throw new Error('Gagal mengambil file M3U');
        }

        // ============================================================
        //  PARSER M3U
        // ============================================================
        function parseM3U(content) {
            const lines = content.split(/\r?\n/);
            const result = [];
            let current = {};
            for (let i = 0; i < lines.length; i++) {
                let line = lines[i].trim();
                if (!line) continue;
                if (line.startsWith('#') && !line.startsWith('#EXTINF') && !line.startsWith('#KODIPROP') && !line
                    .startsWith('#EXTVLCOPT')) continue;
                if (line.startsWith('#EXTINF:')) {
                    const nameMatch = line.match(/,([^,]*)$/);
                    const name = nameMatch ? nameMatch[1].trim() : 'Channel';
                    const logoMatch = line.match(/tvg-logo="([^"]*)"/);
                    const logo = logoMatch ? logoMatch[1] : '';
                    const groupMatch = line.match(/group-title="([^"]*)"/);
                    const group = groupMatch ? groupMatch[1] : 'Sports';
                    current = { name, logo, group, url: '', keyId: '', key: '', licenseUrl: '' };
                } else if (line.startsWith('#KODIPROP:')) {
                    const prop = line.replace('#KODIPROP:', '').trim();
                    if (prop.includes('license_key=')) {
                        const val = prop.split('license_key=')[1].trim();
                        if (val.startsWith('http')) current.licenseUrl = val;
                        else {
                            const parts = val.split(':');
                            if (parts.length === 2) { current.keyId = parts[0].trim();
                                current.key = parts[1].trim(); }
                        }
                    } else if (prop.includes('license_url=')) {
                        current.licenseUrl = prop.split('license_url=')[1].trim();
                    }
                } else if (line.startsWith('http://') || line.startsWith('https://')) {
                    if (current.name) { current.url = line;
                        result.push({ ...current });
                        current = {}; }
                }
            }
            if (current.name && current.url) result.push(current);
            return result;
        }

        // ============================================================
        //  DETECT TYPE
        // ============================================================
        function detectType(url) {
            const u = url.toLowerCase();
            if (u.includes('.mpd') || u.includes('manifest.mpd') || u.includes('cenc.mpd')) return 'dash';
            if (u.includes('.m3u8') || u.includes('playlist.m3u8')) return 'hls';
            if (u.includes('.ts') || u.includes('extension=ts')) return 'mpegts';
            return 'hls';
        }

        // ============================================================
        //  DESTROY ALL
        // ============================================================
        function destroyAll() {
            if (shakaPlayer) { try { shakaPlayer.destroy(); } catch (e) {} shakaPlayer = null; }
            if (hlsPlayer) { try { hlsPlayer.destroy(); } catch (e) {} hlsPlayer = null; }
            if (mpegtsPlayer) { try { mpegtsPlayer.destroy(); } catch (e) {} mpegtsPlayer = null; }
            video.pause();
            video.removeAttribute('src');
            video.load();
        }

        // ============================================================
        //  PLAY CHANNEL - DENGAN TIMEOUT 5 DETIK
        // ============================================================
        async function playChannel(index) {
            if (isSwitching) {
                addLog('⏳ Sedang beralih, skip', 'warn');
                return;
            }

            const ch = filteredChannels[index] || channels[index];
            if (!ch || !ch.url) {
                addLog('❌ Channel tidak valid', 'error');
                setStatus('⚠️ Channel tidak valid', 'error');
                return;
            }

            isSwitching = true;
            currentIndex = index;

            // Clear timeout sebelumnya
            if (switchTimeout) {
                clearTimeout(switchTimeout);
                switchTimeout = null;
            }

            // Timeout 5 detik - jika belum selesai, reset state
            switchTimeout = setTimeout(() => {
                if (isSwitching) {
                    addLog('⏰ Timeout 5 detik, reset state', 'warn');
                    isSwitching = false;
                    loadingIndicator.style.display = 'none';
                    setStatus('⏱️ Timeout, coba channel lain', 'error');
                    // Coba channel berikutnya
                    const nextIdx = (currentIndex + 1) % filteredChannels.length;
                    if (nextIdx !== currentIndex) {
                        setTimeout(() => playChannel(nextIdx), 500);
                    }
                }
            }, 30000);

            addLog(`▶️ [PLAY] ${ch.name}`, 'info');

            document.querySelectorAll('.channel-card').forEach((el, i) => {
                el.classList.toggle('active', i === index);
            });

            loadingIndicator.style.display = 'block';
            loadingIndicator.textContent = `⏳ ${ch.name}`;
            setStatus(`⏳ ${ch.name}`, 'loading');

            destroyAll();

            try {
                const type = detectType(ch.url);

                // ---------- HLS ----------
                if (type === 'hls' && Hls.isSupported()) {
                    let loaded = false;
                    const tryLoad = (url) => {
                        return new Promise((resolve, reject) => {
                            try {
                                if (hlsPlayer) { try { hlsPlayer.destroy(); } catch (e) {} }
                                hlsPlayer = new Hls({
                                    xhrSetup: function(xhr) {
                                        xhr.setRequestHeader('User-Agent',
                                            'ExoPlayerDemo/2.15.1 (Linux; Android 13) ExoPlayerLib/2.15.1'
                                            );
                                        xhr.setRequestHeader('Referer', 'https://www.visionplus.id/');
                                    }
                                });
                                hlsPlayer.loadSource(url);
                                hlsPlayer.attachMedia(video);

                                const onSuccess = () => {
                                    hlsPlayer.off(Hls.Events.MANIFEST_PARSED, onSuccess);
                                    hlsPlayer.off(Hls.Events.ERROR, onError);
                                    loaded = true;
                                    resolve();
                                };
                                const onError = (e, data) => {
                                    if (data.fatal) {
                                        hlsPlayer.off(Hls.Events.MANIFEST_PARSED, onSuccess);
                                        hlsPlayer.off(Hls.Events.ERROR, onError);
                                        reject(new Error(data.details));
                                    }
                                };
                                hlsPlayer.on(Hls.Events.MANIFEST_PARSED, onSuccess);
                                hlsPlayer.on(Hls.Events.ERROR, onError);

                                setTimeout(() => {
                                    if (!loaded) {
                                        hlsPlayer.off(Hls.Events.MANIFEST_PARSED, onSuccess);
                                        hlsPlayer.off(Hls.Events.ERROR, onError);
                                        reject(new Error('Timeout'));
                                    }
                                }, 4000);
                            } catch (err) { reject(err); }
                        });
                    };

                    try {
                        await tryLoad(ch.url);
                        await video.play();
                        loadingIndicator.style.display = 'none';
                        setStatus(`▶️ ${ch.name}`, 'playing');
                        isSwitching = false;
                        if (switchTimeout) { clearTimeout(switchTimeout);
                            switchTimeout = null; }
                        return;
                    } catch (err) {
                        addLog(`⚠️ Gagal: ${err.message}`, 'warn');
                        // Coba proxy
                        for (const proxy of ['https://directv-iptv-player.vercel.app/api/stream?url=']) {
                            try {
                                const proxyUrl = proxy + encodeURIComponent(ch.url);
                                await tryLoad(proxyUrl);
                                await video.play();
                                loadingIndicator.style.display = 'none';
                                setStatus(`▶️ ${ch.name}`, 'playing');
                                isSwitching = false;
                                if (switchTimeout) { clearTimeout(switchTimeout);
                                    switchTimeout = null; }
                                return;
                            } catch (e) { addLog(`⚠️ Proxy gagal`, 'warn'); }
                        }
                        // Fallback native
                        video.src = ch.url;
                        await video.play();
                        loadingIndicator.style.display = 'none';
                        setStatus(`▶️ ${ch.name}`, 'playing');
                        isSwitching = false;
                        if (switchTimeout) { clearTimeout(switchTimeout);
                            switchTimeout = null; }
                        return;
                    }
                }

                // ---------- DASH ----------
                if (type === 'dash') {
                    shakaPlayer = new shaka.Player();
                    const drm = {};
                    if (ch.keyId && ch.key) drm.clearKeys = { [ch.keyId]: ch.key };
                    if (ch.licenseUrl) drm.servers = { 'com.widevine.alpha': ch.licenseUrl };
                    shakaPlayer.configure({
                        drm,
                        manifest: { retryParameters: { maxAttempts: 2, timeout: 4000 } },
                        streaming: { retryParameters: { maxAttempts: 2, timeout: 4000 } }
                    });
                    await shakaPlayer.attach(video);
                    shakaPlayer.getNetworkingEngine().registerRequestFilter((type, req) => {
                        req.headers['User-Agent'] = 'ExoPlayerDemo/2.15.1';
                    });
                    await shakaPlayer.load(ch.url);
                    await video.play();
                    loadingIndicator.style.display = 'none';
                    setStatus(`▶️ ${ch.name}`, 'playing');
                    isSwitching = false;
                    if (switchTimeout) { clearTimeout(switchTimeout);
                        switchTimeout = null; }
                    return;
                }

                // ---------- MPEG-TS / Unknown ----------
                video.src = ch.url;
                await video.play();
                loadingIndicator.style.display = 'none';
                setStatus(`▶️ ${ch.name}`, 'playing');
                isSwitching = false;
                if (switchTimeout) { clearTimeout(switchTimeout);
                    switchTimeout = null; }

            } catch (err) {
                addLog(`❌ Error: ${err.message}`, 'error');
                loadingIndicator.style.display = 'none';
                setStatus(`❌ ${err.message}`, 'error');
                isSwitching = false;
                if (switchTimeout) { clearTimeout(switchTimeout);
                    switchTimeout = null; }

                // Coba channel berikutnya
                const nextIdx = (index + 1) % filteredChannels.length;
                if (nextIdx !== index) {
                    setTimeout(() => playChannel(nextIdx), 500);
                }
            }
        }

        // ============================================================
        //  SET STATUS
        // ============================================================
        function setStatus(text, cls = 'idle') {
            statusEl.textContent = text;
            statusEl.className = 'status-' + cls;
        }

        // ============================================================
        //  RENDER GRID
        // ============================================================
        function render(filter = '') {
            const q = filter.toLowerCase().trim();
            filteredChannels = q ? channels.filter(c => c.name.toLowerCase().includes(q)) : channels;
            if (filteredChannels.length === 0) {
                grid.innerHTML = `<div class="no-result">${q ? '🔍 Tidak ada channel cocok' : '📭 Belum ada channel'}</div>`;
                return;
            }
            let html = '';
            filteredChannels.forEach((ch, idx) => {
                const logo = ch.logo ? `<img src="${ch.logo}" alt="" onerror="this.style.display='none'" />` :
                    `<div style="width:60px;height:60px;border-radius:8px;background:#1a1a1a;border:1px solid #2a2a2a;display:flex;align-items:center;justify-content:center;font-size:24px;margin:0 auto;">📺</div>`;
                html += `
                    <div class="channel-card" data-index="${idx}">
                        ${logo}
                        <div class="name">${ch.name}</div>
                    </div>
                `;
            });
            grid.innerHTML = html;
            document.querySelectorAll('.channel-card').forEach(el => {
                el.addEventListener('click', function() {
                    const idx = parseInt(this.dataset.index);
                    if (idx !== currentIndex) playChannel(idx);
                });
            });
        }

        // ============================================================
        //  LOAD FROM M3U
        // ============================================================
        function loadFromContent(content, name = '') {
            channels = parseM3U(content);
            if (channels.length === 0) {
                addLog('❌ Tidak ada channel', 'error');
                setStatus('⚠️ Tidak ada channel', 'error');
                fileName.textContent = 'File tidak valid';
                return;
            }
            fileName.textContent = name || 'popular-sports-iptv.m3u';
            addLog(`✅ ${channels.length} channel dimuat`, 'success');
            setStatus(`✅ ${channels.length} channel`, 'idle');
            render('');

            // Coba channel yang kemungkinan hidup (skip 5Sport, coba yang lain)
            if (channels.length > 0) {
                // Cari channel yang bukan 5Sport
                let startIdx = 0;
                for (let i = 0; i < Math.min(10, channels.length); i++) {
                    if (!channels[i].name.includes('5Sport') && !channels[i].name.includes('Šport')) {
                        startIdx = i;
                        break;
                    }
                }
                setTimeout(() => playChannel(startIdx), 500);
            }
        }

        // ============================================================
        //  AUTO-LOAD
        // ============================================================
        async function autoLoadFromDropbox() {
            try {
                const content = await fetchM3UFromUrl(M3U_URL);
                if (content) loadFromContent(content, 'popular-sports-iptv.m3u (auto-load)');
                else throw new Error('Konten kosong');
            } catch (err) {
                addLog(`❌ Auto-load gagal: ${err.message}`, 'error');
                setStatus('⚠️ Gagal memuat. Upload manual.', 'error');
                fileName.textContent = 'Gagal auto-load';
                grid.innerHTML = `
                    <div class="no-result">
                        ❌ Gagal memuat dari Dropbox<br>
                        <small style="color:#666;">${err.message}</small><br><br>
                        <button class="upload-btn" onclick="document.getElementById('fileInput').click()" style="margin-top:10px;">
                            📤 Upload Manual
                        </button>
                        <button class="upload-btn" onclick="autoLoadFromDropbox()" style="margin-top:10px;margin-left:10px;background:#ffcc00;color:#000;">
                            🔄 Coba Lagi
                        </button>
                    </div>
                `;
            }
        }

        // ============================================================
        //  EVENTS
        // ============================================================
        document.getElementById('uploadBtn').addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', function(e) {
            const file = this.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => loadFromContent(ev.target.result, file.name);
            reader.onerror = () => addLog('❌ Gagal membaca file', 'error');
            reader.readAsText(file);
        });

        searchInput.addEventListener('input', function() { render(this.value); });
        window.addEventListener('beforeunload', destroyAll);

        // ============================================================
