<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IPTV Berbayar</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #0a0a0a;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: #111;
            padding: 40px 30px;
            border-radius: 20px;
            border: 1px solid #2a2a2a;
            max-width: 420px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,212,255,0.08);
        }
        .card h1 {
            font-size: 28px;
            color: #00d4ff;
            margin-bottom: 8px;
        }
        .card .subtitle {
            color: #aaa;
            margin: 12px 0 20px;
            line-height: 1.6;
        }
        .card .price {
            font-size: 32px;
            font-weight: 700;
            color: #fff;
            background: #1a1a1a;
            padding: 10px;
            border-radius: 12px;
            display: inline-block;
            margin-bottom: 20px;
        }
        .card input {
            width: 100%;
            padding: 14px 16px;
            border-radius: 30px;
            border: 1px solid #2a2a2a;
            background: #1a1a1a;
            color: #fff;
            font-size: 16px;
            outline: none;
            margin-bottom: 16px;
            text-align: center;
            letter-spacing: 1px;
        }
        .card input:focus {
            border-color: #00d4ff;
            box-shadow: 0 0 0 3px rgba(0,212,255,0.15);
        }
        .btn {
            background: #00d4ff;
            color: #0a0a0a;
            border: none;
            padding: 14px 30px;
            border-radius: 30px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.25s;
            width: 100%;
        }
        .btn:hover {
            background: #00b3e6;
            transform: scale(1.02);
        }
        .btn-gratis {
            background: transparent;
            color: #00d4ff;
            border: 2px solid #00d4ff;
            margin-top: 10px;
        }
        .btn-gratis:hover {
            background: #00d4ff;
            color: #0a0a0a;
        }
        .error {
            color: #ff4444;
            font-size: 14px;
            margin-top: 10px;
            min-height: 24px;
        }
        .success {
            color: #00ff88;
        }
        .info-text {
            color: #666;
            font-size: 13px;
            margin-top: 12px;
        }
        .info-text a {
            color: #00d4ff;
            text-decoration: none;
        }
        .divider {
            border-color: #2a2a2a;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>📺 IPTV PREMIUM</h1>
        <p class="subtitle">Akses 100+ channel TV • Kualitas HD • Update otomatis</p>
        <div class="price">Rp 50.000 / bulan</div>

        <!-- ===== FORM LOGIN PREMIUM ===== -->
        <input type="text" id="aksesKode" placeholder="Masukkan Kode Premium" />
        <button class="btn" id="btnLogin">🚀 Buka TV Premium</button>
        <div id="pesanError" class="error"></div>

        <hr class="divider" />

        <!-- ===== TOMBOL AKSES GRATIS ===== -->
        <button class="btn btn-gratis" id="btnGratis">📺 Buka TV Gratis</button>
        <p class="info-text">Channel gratis terbatas • <a href="#" id="btnInfoPremium">Upgrade ke Premium</a></p>

        <hr class="divider" />

        <p style="font-size:14px; color:#666;">Hubungi admin di WhatsApp <br /> <strong style="color:#00d4ff;">+62 812-3456-7890</strong></p>
    </div>

    <script>
        // ============================================================
        //  KONFIGURASI KODE PREMIUM
        // ============================================================
        // Daftar kode akses premium (bisa ditambah sesuai pelanggan)
        const KODE_PREMIUM = [
            'rahasia123',    // kode demo
            'premium2024',
            'tvsewa2025',
            // Tambahkan kode pelanggan di sini
        ];

        // ============================================================
        //  FUNGSI LOGIN
        // ============================================================
        function loginPremiun(kode) {
            const errorEl = document.getElementById('pesanError');

            if (!kode) {
                errorEl.textContent = '⚠️ Masukkan kode akses terlebih dahulu.';
                return false;
            }

            if (KODE_PREMIUM.includes(kode)) {
                // Simpan status login premium
                localStorage.setItem('iptv_user', 'true');
                localStorage.setItem('iptv_kode', kode);
                localStorage.setItem('iptv_premium', 'true');
                errorEl.textContent = '✅ Berhasil! Mengarahkan ke TV Premium...';
                errorEl.className = 'success';
                window.location.href = 'player.html';
                return true;
            } else {
                errorEl.textContent = '❌ Kode akses salah. Coba lagi atau hubungi admin.';
                errorEl.className = 'error';
                document.getElementById('aksesKode').value = '';
                return false;
            }
        }

        function loginGratis() {
            // Simpan status login gratis
            localStorage.setItem('iptv_user', 'true');
            localStorage.setItem('iptv_kode', 'gratis');
            localStorage.setItem('iptv_premium', 'false');
            window.location.href = 'player.html';
        }

        // ============================================================
        //  EVENT LISTENER
        // ============================================================
        // Tombol Premium
        document.getElementById('btnLogin').addEventListener('click', function() {
            const kode = document.getElementById('aksesKode').value.trim();
            loginPremiun(kode);
        });

        // Enter key untuk input kode
        document.getElementById('aksesKode').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                const kode = this.value.trim();
                loginPremiun(kode);
            }
        });

        // Tombol Gratis
        document.getElementById('btnGratis').addEventListener('click', function() {
            loginGratis();
        });

        // Tombol Upgrade ke Premium (scroll ke form)
        document.getElementById('btnInfoPremium').addEventListener('click', function(e) {
            e.preventDefault();
            document.getElementById('aksesKode').focus();
        });

        // ============================================================
        //  CEK SESSION
        // ============================================================
        // Jika sudah login, langsung redirect ke player
        if (localStorage.getItem('iptv_user') === 'true') {
            window.location.href = 'player.html';
        }

        console.log('[INIT] Halaman login siap.');
        console.log('[INIT] Kode premium yang valid:', KODE_PREMIUM);
    </script>
</body>
</html>
